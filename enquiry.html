<head>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation bar -->
    <header>
        <nav>
            <h1>The Golden Glaze Bakery</h1>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>


    <!-- Enquiry content -->
    <main>

        <section>

            <h2>Make an Enquiry</h2>

            <p>
                Have a question about our products?
                Complete the form below and we will get back to you.
            </p>


            <!-- Enquiry form -->
            <form>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>


                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>


                <label for="enquiry-type">Enquiry Type:</label>

                <select id="enquiry-type" name="enquiry-type">

                    <option value="product">Product Enquiry</option>
                    <option value="order">Large Order</option>
                    <option value="occasion">Special Occasion</option>
                    <option value="general">General Enquiry</option>

                </select>


                <label for="message">Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required>
                </textarea>


                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 The Golden Glaze Bakery</p>
    </footer>


    <!-- Connect JavaScript to this page -->
    <script src="js/script.js"></script>

</body>
