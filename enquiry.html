
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make an Enquiry | The Golden Glaze Bakery</title>

    <meta name="description" content="Contact The Golden Glaze Bakery for product enquiries, large orders and special occasion requests.">
    <meta name="keywords" content="Golden Glaze Bakery, cinnamon rolls, bakery enquiries, large orders">
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation bar -->
    <header>
        <nav>
            <h1>The Golden Glaze Bakery</h1>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main enquiry content -->
    <main>

        <section class="enquiry-section">

            <h2>Make an Enquiry</h2>

            <p>
                Interested in our freshly baked cinnamon rolls?
                Complete the form below and tell us how we can assist you.
                Our team will get back to you as soon as possible.
            </p>

            <!-- Enquiry form -->
            <form id="enquiryForm" action="#" method="post">

                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    minlength="2"
                    required>

                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>

                <label for="phone">Contact Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your contact number"
                    pattern="[0-9+\s()-]{7,20}">

                <label for="enquiry-type">Enquiry Type:</label>

                <select id="enquiry-type" name="enquiry-type" required>
                    <option value="">Select an enquiry type</option>
                    <option value="product">Product Enquiry</option>
                    <option value="order">Large Order</option>
                    <option value="occasion">Special Occasion</option>
                    <option value="general">General Enquiry</option>
                </select>

                <label for="message">Your Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    minlength="10"
                    placeholder="Please provide details about your enquiry..."
                    required></textarea>

                <button type="submit">Submit Enquiry</button>

                <p id="enquiryFeedback" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 The Golden Glaze Bakery</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
